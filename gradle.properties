# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reuse the configuration phase between compatible Gradle builds.
org.gradle.configuration-cache=true
# Android Studio supports AGP 9.1.0; current AndroidX artifacts require compile SDK 37.
android.suppressUnsupportedCompileSdk=37.0
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Production AdMob configuration. Supply these in ~/.gradle/gradle.properties or through
# CI -P properties/environment variables; do not commit account-specific values here.
# The offline release variant never packages the ads SDK. The production variant fails
# closed until all three values match their AdMob ID formats and are not Google test IDs.
# MAZEBLOOM_ADMOB_APP_ID=ca-app-pub-0000000000000000~0000000000
# MAZEBLOOM_ADMOB_INTERSTITIAL_ID=ca-app-pub-0000000000000000/0000000000
# MAZEBLOOM_ADMOB_REWARDED_ID=ca-app-pub-0000000000000000/0000000000

# Secure release signing. Keep the keystore outside the repository and inject all four
# values through ~/.gradle/gradle.properties or protected CI environment variables.
# MAZEBLOOM_KEYSTORE_FILE=/absolute/path/to/mazebloom-upload.jks
# MAZEBLOOM_KEYSTORE_PASSWORD=change-me
# MAZEBLOOM_KEY_ALIAS=upload
# MAZEBLOOM_KEY_PASSWORD=change-me

# Public in-app/Play Console privacy-policy URL. The default is the GitHub Pages URL
# backed by docs/index.html; override only when publishing the policy elsewhere.
# MAZEBLOOM_PRIVACY_POLICY_URL=https://naimish0.github.io/MazeBloom/

# Increment for every Play upload. Defaults remain suitable only for the first release.
# MAZEBLOOM_VERSION_CODE=1
# MAZEBLOOM_VERSION_NAME=1.0
